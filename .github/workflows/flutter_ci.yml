name: Build and Distribute APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Distribute APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.7'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Run tests
      run: flutter test

    - name: Build APK
      run: flutter build apk --release --flavor prod

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-prod-release.apk
        retention-days: 30

    - name: Setup Node.js
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Firebase CLI
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: npm install -g firebase-tools

    - name: Authenticate with Firebase
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcloud-service-key.json
        export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcloud-service-key.json"
        firebase --version

    - name: Distribute to Firebase App Distribution
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcloud-service-key.json
      run: |
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > gcloud-service-key.json
        firebase appdistribution:distribute build/app/outputs/flutter-apk/app-prod-release.apk \
          --app 1:977811551855:android:8897af1ee365c44c037f9a \
          --groups "testers" \
          --release-notes "New build from ${{ github.ref_name }} - ${{ github.event.head_commit.message }}"
