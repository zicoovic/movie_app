name: movie_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.2

  # Networking
  dio: ^5.7.0

  # Error Handling
  dartz: ^0.10.1

  # JSON Serialization
  json_annotation: ^4.9.0

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI & Design
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.3

  # Firebase
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.1.5

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  # Splash Screen
  flutter_native_splash: ^2.4.2

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
